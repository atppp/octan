name: Build PDF

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-pdf-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile PDF
        uses: xu-cheng/texlive-action/full@v1
        with:
          run: make pdf

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: octan-pdf
          path: build/octan.pdf
          if-no-files-found: error

      - name: Prepare GitHub Pages site
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p _site
          cp build/octan.pdf _site/octan.pdf
          cat > _site/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>Octan</title>
            <style>
              body { font-family: Georgia, serif; max-width: 36rem; margin: 3rem auto; padding: 0 1.25rem; line-height: 1.5; }
              a { color: #8b1a1a; }
            </style>
          </head>
          <body>
            <h1>Octan</h1>
            <p><i>an intro to an octal world</i></p>
            <p><a href="octan.pdf">Download the PDF</a></p>
          </body>
          </html>
          EOF

      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy-pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
